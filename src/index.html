<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
</head>
<body>
    <header id="header">Todo List</header>

    <div class="body-wrapper">

        <aside class="sidebar">
            <div class="sidebar-top">
                <div id="calendar-tab" class="sidebar-tab">
                    <img src="assets/icons/calendar-blank.svg" alt="Calendar Icon" class="sidebar-icon" id="calendar-icon">
                    <p>Calendar</p>
                </div>

                <div id="today-tab" class="sidebar-tab">
                    <img src="assets/icons/calendar-today.svg" alt="Today Icon" class="sidebar-icon" id="today-icon">
                    <p>Today</p>
                </div>
            </div>

            <div class="sidebar-bottom">
                <div id="project-title">
                    <p id="project-title-btn">Projects</p>
                    <img src="assets/icons/plus.svg" alt="Plus Icon" id="plus-icon">
                </div>

                <div id="projects" class="projects"></div>
            </div>
        </aside>

        <main id="home-page"></main>




        <dialog id="project-modal">
            <form method="POST" id="create-project-form">
                <div id="create-project-header">
                    <img src="assets/icons/folder-arrow-up.svg" alt="Folder Icon" id="folder-icon">
                    <p>New Project</p>
                    <img src="assets/icons/close-thick.svg" alt="Close Icon" id="close-icon">
                </div>

                <div id="project-input-container">
                    <input
                        type="text"
                        name="projectName"
                        id="project-name"
                        placeholder="Enter Project Name:"
                        minlength="1"
                        maxlength="25"
                        required
                    >
                </div>

                <div id="create-project-buttons">
                    <button type="submit" id="create-project-btn">Submit</button>
                </div>
            </form>
        </dialog>

        <dialog id="create-new-task">
            <h2>Complete the following information</h2>

            <form id="task-form">
                <label for="taskD" id="taskD-label">
                    Task Description
                    <textarea id="taskD" name="taskD" placeholder="Type here..." required></textarea>
                </label>

                <label for="taskP" id="taskP-label">
                    Priority
                    <select id="taskP" name="taskP" required>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </label>

                <label for="taskDue" id="taskDue-label">
                    Due Date
                    <input type="date" id="taskDue" name="taskDue" required>
                </label>

                <img src="assets/icons/close-thick.svg" alt="Close Icon" id="close-taskcreation">
                <button type="submit" id="save-taskcreation">Save</button>
            
            </form>
        </dialog>

        <dialog id="edit-task-modal">
            <form method="POST" id="edit-task-form">
                <div id="edit-task-header">
                    <p>Task Details</p>
                </div>

                <div class="edit-task-input-container">
                    <label for="editDescription">Description</label>
                    <textarea name="editDescription" id="editDescription" rows="5" cols="30"></textarea>
                </div>

                <div class="edit-task-input-container">
                    <label for="editPriority">Priority</label>
                    <select id="editPriority" name="editPriority">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <div class="edit-task-input-container">
                    <label for="editDueDate">Due Date</label>
                    <input type="date" id="editDueDate" name="editDueDate">
                </div>

                <button type="button" id="complete-edit-task-btn" class="edit-task-form-button">
                    Complete Task!
                </button>

                <img src="assets/icons/close-thick.svg" alt="Close Icon" id="close-edit-task-icon">

                <div id="save-edit-task-btn-container">
                    <button type="button" id="delete-edit-task-btn" class="edit-task-form-button">
                        Delete Task
                    </button>
                    <button type="submit" id="save-edit-task-btn" class="edit-task-form-button">
                        Save
                    </button>
                </div>
            </form>
        </dialog>
        
    </div>
</body>
</html>
