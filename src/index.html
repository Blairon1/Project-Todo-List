<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
</head>
<body>
    <div id="header">To-Do List Odin</div>
    <div class="body-wrapper">
        <div class="sidebar">
            <div class="siderbar-tophalf">
                <div id="calendar-tab" class="sidebar-tabs">
                    <img src="assets/icons/calendar-blank.svg" alt="Calendar Icon" class="sidebar-icons" id="calendar-icon">
                    <p>Calendar</p>
                </div>
                <div id="today-tab" class="sidebar-tabs">
                    <img src="assets/icons/calendar-today.svg" alt="Today Icon" class="sidebar-icons" id="today-icon">
                    <p>Today</p>
                </div>
                <div id="filters-tab" class="sidebar-tabs">
                    <img src="assets/icons/view-grid-outline.svg" alt="Filters & Labels Icon" class="sidebar-icons" id="filter-icon">
                    <p>Filters & Labels</p>
                </div>
                <div id="completed-tab" class="sidebar-tabs">
                    <img src="assets/icons/checkbox-multiple-marked-circle.svg" alt="Completed Icon" class="sidebar-icons" id="completed-icon">
                    <p>Completed</p>
                </div>
            </div>
            <div class="sidebar-bottomhalf">
                <div id="project-title">
                    <p id="project-title-btn">Projects</p>
                    <img src="assets/icons/plus.svg" alt="Plus Icon" id="plus-icon">
                </div>
                <div class="projects" id="projects"></div>
            </div>
        </div>


        <div id="home-page">
            
        </div>


        <dialog id="project-modal">
            <form action="" method="POST" id="create-project-form">
                <div id="create-project-header">
                    <img src="assets/icons/folder-arrow-up.svg" alt="Folder Icon" id="folder-icon">
                    <p>New Project</p>
                    <img src="assets/icons/close-thick.svg" alt="Close Icon" id="close-icon">
                </div>
                <div id="project-input-container">
                    <input type="text" name="projectName" id="project-name" placeholder="Enter Project Name:" minlength="1" maxlength="25">
                </div>

                <div id="create-project-buttons">
                    <button type="submit" id="create-project-btn">Submit</button>
                </div>
            </form>
        </dialog>

        <dialog id="task-container-modal">
            <div id="todo-list-chart">
                <div class="todo-list-row-header">
                    <div id="task-number-header">#</div>
                    <div id="task-description-header">To-Do List</div>
                    <div id="task-status-header">Status</div>
                    <div id="task-priority-header">Priority</div>
                    <div id="task-date-header">Due Date</div>
                </div>
                <div id="task-row">
                    <div id="new-row-wrapper" class="new-row-wrapper">
                        <div class="task" id="task-number">1</div>
                        <div class="task" id="task-description">To get some bitches</div>
                        <div class="task" id="task-status">
                            <button id="task-status-btn">Not Completed</button>
                        </div>
                        <div class="task" id="task-priority">High</div>
                        <div class="task" id="task-date">2026-08-17</div>
                    </div>
                </div>
                <div id="create-task-row">
                    <div id="create-task-btn">Create Task</div>
                </div>
            </div>
        </dialog>

        <dialog id="create-new-task">
            <h2 style="margin-bottom: 1rem;">Complete the following information</h2>
            <form id="task-form">
                <label for="taskD">Task Descripton:
                    <textarea id="taskD" name="taskD" rows="5" cols="30" placeholder="Type here..."></textarea><br>
                </label>


                <label for="taskP">Prority
                    <br><select id="taskP" name="taskP">
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
                </label><br>


                <label for="taskDue">Due Date
                   <br> <input type="date" id="taskDue" name="taskDue">
                </label><br>

                <div class="task-creation-btns">
                    <button type="button" id="close-taskcreation">Close</button>
                    <button type="submit" id="save-taskcreation">Save</button>
                </div>
            </form>
        </dialog>


        <dialog id="edit-task-modal">
            <form action="" method="POST" id="edit-task-form">
                <div id="edit-task-header">
                    <p>Edit Task</p>
                </div>
                <div class="edit-task-input-containers">
                    <label for="editDescription">Description</label>
                    <textarea name="editDescription" id="editDescription" rows="5" cols="30"></textarea>
                </div>
                <div class="edit-task-input-containers">
                    <label for="editPrority">Priority</label>
                        <select id="editPrority" name="editPrority">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                </div>
                <div class="edit-task-input-containers">
                    <label for="editDueDate">Due Dates</label>
                    <input type="date" id="editDueDate" name="editDueDate">
                </div>
                <button id="complete-edit-task-btn" class="edit-task-form-btns">Complete Task!</button>
                <img src="assets/icons/close-thick.svg" alt="Close Icon" id="close-edit-task-icon">
                

                <div id="save-edit-task-btn-container">
                    <button id="delete-edit-task-btn" class="edit-task-form-btns">Delete Task</button>
                    <button type="submit" id="save-edit-task-btn" class="edit-task-form-btns">Save</button>
                </div>
            </form>
        </dialog>

        
    </div>
    

</body>

</html>
